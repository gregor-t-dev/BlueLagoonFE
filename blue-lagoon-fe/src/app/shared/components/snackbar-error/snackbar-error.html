<span class="snack-message" matSnackBarLabel>
  <mat-icon fontIcon="error" class="snack-icon"></mat-icon>
  {{ message }}
</span>
<span matSnackBarActions>
  <button
    matButton="filled"
    matSnackBarAction
    (click)="snackBarRef.dismissWithAction()"
    class="snack-action-button"
  >
    OK
  </button>
</span>
